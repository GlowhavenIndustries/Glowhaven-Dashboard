apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glowhaven-dashboard.fullname" . }}-secret
  labels:
    {{- include "glowhaven-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.glowhavenMasterKey }}
  GLOWHAVEN_MASTER_KEY: {{ .Values.glowhavenMasterKey | quote }}
  {{- end }}
  {{- if .Values.externalSecrets.vaultToken }}
  VAULT_TOKEN: {{ .Values.externalSecrets.vaultToken | quote }}
  {{- end }}
